[versions]
agp           = "8.7.3"
kotlin        = "2.0.21"
composeBom    = "2024.12.01"
activity      = "1.9.3"
lifecycle     = "2.8.7"
datastore     = "1.1.1"
glance        = "1.1.1"
wearCompose   = "1.4.0"
junit4        = "4.13.2"
coroutines    = "1.8.1"
openhab       = "2.0.0"

[libraries]
openhab-client       = { group = "com.github.Michdo93", name = "android-openhab-rest-client", version.ref = "openhab" }
openhab-testsuite    = { group = "com.github.Michdo93", name = "android-openhab-test-suite", version.ref = "openhab" }
compose-bom          = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3    = { group = "androidx.compose.material3", name = "material3" }
compose-ui           = { group = "androidx.compose.ui", name = "ui" }
compose-preview      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
activity-compose     = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
lifecycle-vm-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-rt-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
datastore            = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
glance               = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3     = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
wear-compose-material   = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
junit4               = { group = "junit", name = "junit", version.ref = "junit4" }
coroutines-test      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
